<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blunt Thorn vs. Multi-Crit Calculator</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      margin: 0;
      padding: 24px;
    }
    .container {
      max-width: 960px;
      margin: 0 auto;
      background: #1e293b;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    }
    h1 { margin: 0 0 8px; font-size: 1.4rem; }
    p.sub { margin: 0 0 20px; color: #94a3b8; font-size: 0.95rem; }
    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 20px;
      background: #0f172a;
      padding: 16px;
      border-radius: 8px;
    }
    label { display: block; font-size: 0.85rem; color: #cbd5e1; margin-bottom: 6px; }
    select, input[type="range"], button {
      width: 100%;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #f8fafc;
      font-size: 0.9rem;
    }
    button { cursor: pointer; background: #2563eb; border-color: #3b82f6; font-weight: 600; }
    button:hover { background: #1d4ed8; }
    .chart-wrap { position: relative; height: 420px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Blunt Thorn Lv. 2 vs. Multi-Crit (+Standing Striker Lv. 2)</h1>
    <p class="sub">Compares total average damage multiplier or relative % gain across 60%–150% Crit Rate.</p>

    <div class="controls">
      <div>
        <label for="cdSelect">Crit Damage (%)</label>
        <select id="cdSelect">
          <option value="250">250%</option>
		  <option value="275">275%</option>
          <option value="300">300%</option>
		  <option value="325">325%</option>
          <option value="350" selected>350%</option>
		  <option value="375">375%</option>
          <option value="400">400%</option>
		  <option value="425">425%</option>
          <option value="450">450%</option>
		  <option value="475">475%</option>
          <option value="500">500%</option>
        </select>
      </div>
      <div>
        <label for="evoSlider">Total Profile Evolution DMG: <span id="evoVal">60</span>%</label>
        <input id="evoSlider" type="range" min="30" max="90" step="1" value="60" />
      </div>
      <div>
        <label for="modeBtn">Display Mode</label>
        <button id="modeBtn" type="button">Mode: Raw Damage Multiplier</button>
      </div>
    </div>

    <div class="chart-wrap">
      <canvas id="calcChart"></canvas>
    </div>
  </div>

  <script>
    const critRates = Array.from({ length: 19 }, (_, i) => 0.60 + i * 0.05);
    let viewMode = "raw";

    const cdSelect = document.getElementById("cdSelect");
    const evoSlider = document.getElementById("evoSlider");
    const evoVal = document.getElementById("evoVal");
    const modeBtn = document.getElementById("modeBtn");

    function computeSeries() {
      const cd = Number(cdSelect.value) / 100;
      const eProfile = Number(evoSlider.value) / 100;
      evoVal.textContent = evoSlider.value;

      const labels = critRates.map(cr => `${Math.round(cr * 100)}%`);
      const btRaw = critRates.map(cr => {
        const cEff = Math.min(cr, 0.80);
        const cExcess = Math.max(0, cr - 0.80);
        return (1 + cEff * (cd - 1)) * (1 + eProfile - 0.02 + 1.40 * cExcess);
      });
      const mcRaw = critRates.map(cr => (1 + cr * (cd - 1)) * (1 + eProfile));
      const relPct = btRaw.map((bt, idx) => ((bt / mcRaw[idx]) - 1) * 100);

      return { labels, btRaw, mcRaw, relPct };
    }

    const initial = computeSeries();
    const ctx = document.getElementById("calcChart").getContext("2d");
    const chart = new Chart(ctx, {
      type: "line",
      data: {
        labels: initial.labels,
        datasets: [
          {
            label: "Blunt Thorn Lv. 2",
            data: initial.btRaw,
            borderColor: "#38bdf8",
            backgroundColor: "#38bdf8",
            tension: 0.15
          },
          {
            label: "Multi-Crit + Other last node of Evolution",
            data: initial.mcRaw,
            borderColor: "#f97316",
            backgroundColor: "#f97316",
            tension: 0.15
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { mode: "index", intersect: false },
        plugins: { legend: { labels: { color: "#e2e8f0" } } },
        scales: {
          x: { ticks: { color: "#cbd5e1" }, grid: { color: "#334155" } },
          y: { ticks: { color: "#cbd5e1" }, grid: { color: "#334155" } }
        }
      }
    });

    function updateChart() {
      const { labels, btRaw, mcRaw, relPct } = computeSeries();
      chart.data.labels = labels;
      if (viewMode === "raw") {
        chart.data.datasets = [
          { label: "Blunt Thorn Lv. 2", data: btRaw, borderColor: "#38bdf8", backgroundColor: "#38bdf8", tension: 0.15 },
          { label: "Multi-Crit + Standing Striker (+21%)", data: mcRaw, borderColor: "#f97316", backgroundColor: "#f97316", tension: 0.15 }
        ];
      } else {
        chart.data.datasets = [
          { label: "Blunt Thorn vs. Multi-Crit (%)", data: relPct, borderColor: "#22c55e", backgroundColor: "#22c55e", tension: 0.15 }
        ];
      }
      chart.update();
    }

    cdSelect.addEventListener("change", updateChart);
    evoSlider.addEventListener("input", updateChart);
    modeBtn.addEventListener("click", () => {
      viewMode = viewMode === "raw" ? "relative" : "raw";
      modeBtn.textContent = viewMode === "raw" ? "Mode: Raw Damage Multiplier" : "Mode: Relative DPS %";
      updateChart();
    });
  </script>
</body>
</html>
